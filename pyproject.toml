[project]
name = "line-vault-bot"
version = "1.0.0"
description = "LINE公式アカウントのメッセージを Obsidian Vault（GitHub）に記録し、質問回答・お知らせ・リマインドを行うボット"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 130

[tool.ruff.lint]
select = ["F", "E9", "B", "UP", "I"]
# 文字コードを扱うテストでは encode("utf-8") を明示したほうが読みやすいため
ignore = ["UP012"]
