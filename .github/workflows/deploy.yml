# テスト → コンテナのビルド → Cloud Run へのデプロイ
#
# - プルリクエスト：テストと、コンテナのビルド・動作確認（LibreOffice の変換）まで
# - main への push：上に加えて Artifact Registry へ登録し、Cloud Run にデプロイ
#
# Google Cloud への認証は Workload Identity 連携（サービスアカウントキーは使わない）。
# 必要なリポジトリ変数（Settings → Secrets and variables → Actions → Variables）は README を参照。
name: テストとデプロイ

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 依存ライブラリのインストール
        run: pip install -r requirements-dev.txt

      - name: 静的チェック
        run: ruff check app tests

      - name: テスト
        run: pytest

  build-and-deploy:
    name: ビルドとデプロイ
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Workload Identity 連携に必要
    env:
      DEPLOY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      IMAGE: ${{ vars.GCP_REGION || 'asia-northeast1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID || 'local' }}/${{ vars.AR_REPOSITORY || 'line-bot' }}/${{ vars.SERVICE_NAME || 'line-vault-bot' }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: コンテナのビルド
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: コンテナの動作確認（起動に必要なモジュールと LibreOffice の変換）
        run: |
          docker run --rm -i --entrypoint python "$IMAGE" - <<'PY'
          import asyncio, io, pathlib, tempfile
          from docx import Document
          import app.main  # noqa: F401  起動に必要なモジュールが読み込めること
          from app.extract import convert_with_libreoffice, extract_office

          doc = Document()
          doc.add_paragraph("動作確認")
          buf = io.BytesIO()
          doc.save(buf)
          src = pathlib.Path(tempfile.mkdtemp()) / "check.docx"
          src.write_bytes(buf.getvalue())

          async def main():
              legacy = await convert_with_libreoffice(src, "doc")
              text = await extract_office(legacy.read_bytes(), "check.doc")
              assert "動作確認" in text, text
              print("LibreOffice による旧形式の変換と抽出: OK")

          asyncio.run(main())
          PY

      - name: デプロイ用の設定（リポジトリ変数）の確認
        if: env.DEPLOY == 'true'
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          SERVICE_NAME: ${{ vars.SERVICE_NAME }}
          AR_REPOSITORY: ${{ vars.AR_REPOSITORY }}
          SERVICE_URL: ${{ vars.SERVICE_URL }}
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          DEPLOYER_SA: ${{ vars.DEPLOYER_SA }}
          RUNTIME_SA: ${{ vars.RUNTIME_SA }}
          TASKS_INVOKER_SA: ${{ vars.TASKS_INVOKER_SA }}
          SCHEDULER_INVOKER_SA: ${{ vars.SCHEDULER_INVOKER_SA }}
        run: |
          missing=""
          for name in GCP_PROJECT_ID GCP_REGION SERVICE_NAME AR_REPOSITORY SERVICE_URL WIF_PROVIDER DEPLOYER_SA RUNTIME_SA TASKS_INVOKER_SA SCHEDULER_INVOKER_SA; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::リポジトリ変数が未設定です:$missing（README の「GitHub のリポジトリ変数を設定する」を参照）"
            exit 1
          fi

      - name: Google Cloud への認証
        if: env.DEPLOY == 'true'
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
          token_format: access_token

      - name: Artifact Registry へのログイン
        if: env.DEPLOY == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: コンテナの登録
        if: env.DEPLOY == 'true'
        run: docker push "$IMAGE"

      - name: Cloud Run へのデプロイ
        if: env.DEPLOY == 'true'
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          service: ${{ vars.SERVICE_NAME }}
          image: ${{ env.IMAGE }}
          env_vars_update_strategy: overwrite
          env_vars: |-
            GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
            GCP_REGION=${{ vars.GCP_REGION }}
            SERVICE_URL=${{ vars.SERVICE_URL }}
            TASKS_INVOKER_SA=${{ vars.TASKS_INVOKER_SA }}
            SCHEDULER_INVOKER_SA=${{ vars.SCHEDULER_INVOKER_SA }}
            INGEST_QUEUE=line-ingest
            ASK_QUEUE=line-ask
            CLAUDE_MODEL_TRANSCRIBE=${{ vars.CLAUDE_MODEL_TRANSCRIBE || 'claude-opus-5-5' }}
            CLAUDE_MODEL_ANSWER=${{ vars.CLAUDE_MODEL_ANSWER || 'claude-opus-5-5' }}
            CLAUDE_EFFORT_TRANSCRIBE=${{ vars.CLAUDE_EFFORT_TRANSCRIBE || 'medium' }}
            CLAUDE_EFFORT_ANSWER=${{ vars.CLAUDE_EFFORT_ANSWER || 'medium' }}
            CLAUDE_EFFORT_ROUTER=${{ vars.CLAUDE_EFFORT_ROUTER || 'low' }}
            CLAUDE_FALLBACKS=${{ vars.CLAUDE_FALLBACKS || 'default' }}
            ${{ vars.VAULT_BRANCH && format('VAULT_BRANCH={0}', vars.VAULT_BRANCH) || '' }}
          secrets_update_strategy: overwrite
          secrets: |-
            LINE_CHANNEL_SECRET=line-channel-secret:latest
            LINE_CHANNEL_ACCESS_TOKEN=line-channel-access-token:latest
            OWNER_LINE_USER_ID=owner-line-user-id:latest
            ANTHROPIC_API_KEY=anthropic-api-key:latest
            GITHUB_TOKEN=github-token:latest
            VAULT_REPO=vault-repo:latest
          flags: >-
            --service-account=${{ vars.RUNTIME_SA }}
            --execution-environment=gen2
            --cpu=1
            --memory=2Gi
            --timeout=1800
            --concurrency=20
            --min-instances=${{ vars.MIN_INSTANCES || '1' }}
            --max-instances=5
            --cpu-boost

      - name: 起動確認
        if: env.DEPLOY == 'true'
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS "${{ vars.SERVICE_URL }}/health"; then echo; exit 0; fi
            sleep 10
          done
          echo "起動確認に失敗しました" >&2
          exit 1
